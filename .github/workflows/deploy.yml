name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 水庫即時水情是建置期抓的（純靜態站沒辦法在執行期打水利署 API，見
  # src/content/index.ts），所以「即時」的更新頻率＝重新部署的頻率。每 6 小時
  # 重跑一次，水情最多落後 6 小時，卡片上也會照實顯示觀測時間。
  #
  # 為什麼不更密：每次都是一次完整的 build + Pages 部署，而水庫水位是以天為
  # 尺度在變的東西——課堂上要的是「現在大概還有多少水」，不是分鐘級的即時值。
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

# 同時只跑一個部署；新的 push 進來就取消排隊中的舊工作，
# 但不中斷正在進行的部署（cancel-in-progress: false）。
concurrency:
  group: pages
  cancel-in-progress: false

# ⚠️ action 版本要一起往上升，不要只升一兩個。
#
# runner 從 2025-09 起淘汰 Node.js 20：還在 target Node 20 的 action 會被強制跑在
# Node 24 上，並在每次執行留下 deprecation annotation。下面這組是各 action 目前的
# 最新 major，全部原生 target Node 24，annotation 因此消失。
#
# 這裡刻意用浮動的 major 標籤（`@v7`）而不是釘死 SHA：這個 workflow 只用到最基本的
# 輸入（node-version／cache／path），跟著 major 走可以自動收到修補，而 major 不會有
# 破壞性變更。要改成釘 SHA 是另一個決定（供應鏈強化），不要順手混進來。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 水庫即時水情：唯一一個會在 CI 打外部 API 的步驟。
      #
      # ⚠️ `continue-on-error` 是刻意的，不是偷懶。repo 裡已經 commit 了一份
      # reservoirs-live.json 當 fallback，所以上游掛掉（或 bot 防護擋下來）時，
      # 正確的行為是**沿用舊快照繼續部署**，而不是讓整個網站發不出去。
      # 使用者看得到觀測時間，知道自己在看多舊的資料。
      - name: 重抓水庫即時水情（失敗則沿用 repo 裡的快照）
        continue-on-error: true
        run: npm run build:reservoirs

      # build 內含 validate（內容 schema）、typecheck、vite build
      # 以及 postbuild（產生 404.html、確認 CNAME 與 .nojekyll）
      - run: npm run build

      # 換成 Cloudflare Pages：wrangler 直接把 dist/ 上傳到 Cloudflare 的
      # Pages 專案，不再需要 configure-pages / upload-pages-artifact /
      # deploy-pages 那一組 GitHub 專用 action。
      #
      # ⚠️ 這兩把 secret 要先在 GitHub repo 的
      # Settings → Secrets and variables → Actions 裡設好，
      # 而且 Cloudflare 那邊要先用 direct upload 建好名為 gaia 的 Pages 專案，
      # 否則這一步會直接失敗。見 CLOUDFLARE.md「遷移步驟 → 階段一」。
      #
      # ⚠️ --branch=main 不可以省。actions/checkout 在 CI 裡預設 checkout 到
      # detached HEAD，wrangler 猜不到目前在哪個分支，猜不到就會把這次部署當成
      # preview（網址是帶 hash 前綴的 <hash>.gaia-1pt.pages.dev），而不是更新
      # production 網址（gaia-1pt.pages.dev）。實測踩過：production 網址一直
      # 是空白，內容其實已經上傳到 preview 網址。
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=gaia --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
