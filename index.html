<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>GAIA 人文地理互動地圖</title>
    <meta
      name="description"
      content="國中／高中地理課程的互動地圖：等高線地形、原住民族分佈與特有種生態，以及同緯度不同地區的地形與氣候比較。"
    />
    <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <script>
      // 在 React 掛載、CSS 套用之前先設好 data-theme，避免使用者選過「淺色」但
      // 系統是深色模式時，畫面先閃一下深色才切回淺色。邏輯必須跟 src/useTheme.ts
      // 的 readStored/applyToDocument 保持一致。
      (function () {
        try {
          var v = localStorage.getItem("gaia-theme");
          if (v === "light" || v === "dark") {
            document.documentElement.setAttribute("data-theme", v);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
